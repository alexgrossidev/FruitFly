[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fly-number-recognition"
version = "0.0.1"
description = "Train a real fruit fly connectome to detect digits 6/7 in a list of 10, visualized on real neuron anatomy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyarrow>=14",
    # connectorch is not on PyPI; it is installed editable from the pinned
    # submodule in vendor/connectorch by scripts/bootstrap.sh, not from here.
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
